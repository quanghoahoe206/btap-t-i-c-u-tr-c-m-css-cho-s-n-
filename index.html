<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SASS Grid Practice</title>

    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <div class="main-wrapper">

        <div class="gridcontainer">

            <!-- Header -->
            <div class="gridwrapper header">
                <div class="gridcontent"></div>
            </div>

            <!-- Content -->
            <div class="gridwrapper content">

                <!-- Left -->
                <div class="gridcontent left">

                    <div class="menu-item"></div>
                    <div class="menu-item"></div>
                    <div class="menu-item"></div>
                    <div class="menu-item"></div>

                </div>

                <!-- Middle columns -->
                <div class="gridcontent"></div>
                <div class="gridcontent"></div>
                <div class="gridcontent"></div>
                <div class="gridcontent"></div>
                <div class="gridcontent"></div>
                <div class="gridcontent"></div>

                <!-- Right -->
                <div class="gridcontent right">

                    <div class="right-content"></div>

                </div>

            </div>

            <!-- Footer -->
            <div class="gridwrapper footer">
                <div class="gridcontent"></div>
            </div>

        </div>

    </div>

    <!-- Grid overlay -->
    <div class="gridcontainer overlay">

        <div class="gridwrapper">

            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>
            <div class="gridcontent"></div>

        </div>

    </div>

    <p>
        Resize the browser window to see that this grid will respond
        to the resizing, and always use 100% of the available space.
    </p>

</body>

</html>
